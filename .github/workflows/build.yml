name: Build APKs
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - run: gradle assembleDebug
      - run: |
          mkdir -p out/public out/private
          cp app/build/outputs/apk/debug/app-debug.apk "out/public/Unoxidized X.apk"
          cp generator/build/outputs/apk/debug/generator-debug.apk "out/public/Unoxidized Generator.apk"
          cp owner/build/outputs/apk/debug/owner-debug.apk "out/private/Unoxidized Owner.apk"
      - uses: actions/upload-artifact@v4
        with: {name: UnoxidizedX, path: out/public}
      - uses: actions/upload-artifact@v4
        with: {name: UnoxidizedOwner-PRIVATE, path: out/private}

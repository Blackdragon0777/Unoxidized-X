name: Build 4 Apps
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - run: gradle assembleDebug
      - run: |
          mkdir -p out/public out/private
          cp app/build/outputs/apk/debug/app-debug.apk "out/public/NACHT X.apk"
          cp generator/build/outputs/apk/debug/generator-debug.apk "out/public/NACHT X Generator.apk"
          cp info/build/outputs/apk/debug/info-debug.apk "out/public/NACHT X Information.apk"
          cp owner/build/outputs/apk/debug/owner-debug.apk "out/private/NACHT X Owner.apk"
      - uses: actions/upload-artifact@v4
        with: {name: UnoxidizedX, path: out/public, compression-level: 0}
      - if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with: {name: UnoxidizedOwner-PRIVATE, path: out/private, compression-level: 0}
      - name: Publish release with direct APK files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(out/public/*.apk)
          if [ "${{ github.event.repository.private }}" = "true" ]; then FILES+=(out/private/*.apk); fi
          gh release create "build-${{ github.run_number }}" "${FILES[@]}" --title "NACHT X build ${{ github.run_number }}" --notes "NACHT X, Generator and Information are for sharing. The Owner APK is only published from a PRIVATE repo. Never share it."
